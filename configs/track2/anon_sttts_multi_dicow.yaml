models_dir: exp/sttts_multi_models
save_intermediate: true
intermediate_dir: !ref exp/anon_pipeline_<pipeline>
download_precomputed_intermediate_repr: false

modules:
  asr:
    recognizer: dicow
    model_name: BUT-FIT/DiCoW_v3_2
    model_path: !ref <models_dir>/dicow_v3_2
    # Fallback if cut.custom['anonymize'] is missing; per-cut target comes from the manifest.
    target_speaker_id: "0"
    language: en
    batch_size: 4
    num_beams: 1
    decoding_ctc_weight: 0.0
    return_timestamps: true
    force_compute_recognition: false
    utt_start_token: ""
    utt_end_token: ""
    results_path: !ref <intermediate_dir>/transcription/dicow

  speaker_embeddings:
    anonymizer: ims
    force_compute_extraction: false
    force_compute_anonymization: false
    vec_type: ecapa
    emb_model_path: !ref <models_dir>/spkrec-ecapa-voxceleb
    anon_settings:
      method: gan
      vectors_file: !ref <models_dir>/embedding_gan_generated_vectors.pt
      gan_model_path: !ref <models_dir>/embedding_gan.pt
      num_sampled: 50000
      sim_threshold: 0.7
    extraction_results_path: !ref <intermediate_dir>/original_speaker_embeddings/<modules[speaker_embeddings][vec_type]>
    anon_results_path: !ref <intermediate_dir>/anon_speaker_embeddings/<modules[speaker_embeddings][vec_type]>
    # per-segment GAN for speaker 0 (mix-local people share only the role id "0")
    anon_level_spk: []
    anon_level_utt: [
                     #librimix_enrolls,
                    #  sparse_2_0_mix_clean_mono, 
                    #  sparse_2_0.2_mix_clean_mono, 
                    #  sparse_2_0.4_mix_clean_mono, 
                    #  sparse_2_0.6_mix_clean_mono, 
                    #  sparse_2_0.8_mix_clean_mono,
                    #  sparse_2_1_mix_clean_mono,
                     sparse_2_0_mix_clean, 
                      sparse_2_0.2_mix_clean,
                      sparse_2_0.4_mix_clean, 
                      sparse_2_0.6_mix_clean, 
                      sparse_2_0.8_mix_clean,
                     sparse_2_1_mix_clean,
                    #  sparse_2_0_mix_clean_gt, 
                    #  sparse_2_0.2_mix_clean_gt, 
                    #  sparse_2_0.4_mix_clean_gt, 
                    #  sparse_2_0.6_mix_clean_gt, 
                    #  sparse_2_0.8_mix_clean_gt,
                    #  sparse_2_1_mix_clean_gt,
                     ]

  # BM2-style: IMS aligner → per-phone duration/pitch/energy for Toucan.
  # No random pitch/energy offset (anonymizer_type omitted).
  # turn_kaldi crops are already Diarizen windows; do not VAD-trim onsets.
  # tse=true: aligner reads turn_tse_kaldi (same windows, TSE s1 / residual wavs).
  # Original turn_kaldi is still written; embeddings/remix keep using the mix.
  prosody:
    extractor_type: ims
    force_compute_extraction: true
    trim_silence: false
    aligner_model_path: !ref <models_dir>/aligner.pt
    extraction_results_path: !ref <intermediate_dir>/original_prosody/ims_extractor
    tse: true
    tse_dir: !ref <intermediate_dir>/tse
    tse_s1_subdir: s1
    tse_residual_subdir: s1_residual

  tts:
    synthesizer: ims
    fastspeech_path: !ref <models_dir>/ToucanTTS_Meta.pt
    hifigan_path: !ref <models_dir>/Vocoder.pt
    embeddings_path: !ref <models_dir>/spkrec-ecapa-voxceleb
    output_sr: 16000
    # Old TTS wavs were generated without gold durations; rebuild once, then set false.
    force_compute_synthesis: true
    results_path: !ref <intermediate_dir>/anon_speech/ims_sttts_multi_dicow
